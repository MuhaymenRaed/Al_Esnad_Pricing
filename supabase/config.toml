# Supabase CLI configuration (optional).
# The production project is configured in the dashboard (docs/DEPLOYMENT.md);
# this file mirrors those settings for `supabase start` (local) and
# `supabase config push`. Secrets are read from the environment — never inline.

project_id = "alesnad-pricing"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/callback",
  "https://pricing.alisnad.iq/auth/confirm",
  "https://pricing.alisnad.iq/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Employees are invited by administrators; nobody can self-register.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 60

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Brevo transactional SMTP (https://app.brevo.com → SMTP & API).
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(BREVO_SMTP_LOGIN)"
pass = "env(BREVO_SMTP_KEY)"
admin_email = "env(BREVO_SENDER_EMAIL)"
sender_name = "Al-Esnad Pricing"

[auth.email.template.invite]
subject = "You're invited to Al-Esnad Pricing"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Al-Esnad Pricing password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your e-mail for Al-Esnad Pricing"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new e-mail address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Your Al-Esnad Pricing sign-in link"
content_path = "./supabase/templates/magic_link.html"
